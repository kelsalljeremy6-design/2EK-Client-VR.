
name: Build 2EK Client - Meta Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      GODOT_VERSION: "4.7.2"
      OPENXR_VENDORS_VERSION: "5.1.0-stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install OpenXR vendor plugin
        run: |
          set -e
          curl -fL \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" \
            -o /tmp/openxr.zip
          unzip -q /tmp/openxr.zip -d /tmp/openxr
          test -d /tmp/openxr/asset/addons/godotopenxrvendors
          mkdir -p addons
          rm -rf addons/godotopenxrvendors
          mv /tmp/openxr/asset/addons/godotopenxrvendors addons/

      - name: Verify Android Quest preset
        run: |
          grep -q 'name="Android Quest"' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg

      - name: Import Godot project
        run: godot --headless --editor --path . --import

      - name: Export Quest APK
        run: |
          set -e
          mkdir -p build/android-quest
          godot --headless \
            --path . \
            --install-android-build-template \
            --export-debug "Android Quest" \
            build/android-quest/2EK-Client-Quest.apk
          test -s build/android-quest/2EK-Client-Quest.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: 2EK-Client-Quest-APK
          path: build/android-quest/2EK-Client-Quest.apk
          if-no-files-found: error
          retention-days: 14
