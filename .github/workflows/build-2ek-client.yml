
name: Build 2EK Client - Meta Quest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "game/**"
      - "addons/**"
      - ".github/workflows/build-2ek-client.yml"

permissions:
  contents: read

concurrency:
  group: 2ek-client-quest-build
  cancel-in-progress: true

jobs:
  build-quest-apk:
    name: Build Android Quest APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GODOT_VERSION: "4.7.2"
      OPENXR_VENDORS_VERSION: "5.1.0-stable"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout 2EK Client
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install OpenXR vendor plugin
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" \
            -o /tmp/godot-openxr-vendors.zip
          mkdir -p addons
          unzip -q /tmp/godot-openxr-vendors.zip -d /tmp/openxr-vendors
          test -d /tmp/openxr-vendors/asset/addons/godotopenxrvendors
          rm -rf addons/godotopenxrvendors
          mv /tmp/openxr-vendors/asset/addons/godotopenxrvendors addons/

      - name: Verify Quest export preset
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="Android Quest"' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg
          echo "Android Quest preset and ARM64 configuration found."

      - name: Import Godot project
        run: godot --headless --editor --path . --import

      - name: Export Quest APK
        run: |
          set -euo pipefail
          mkdir -p build/android-quest
          godot --headless \
            --path . \
            --install-android-build-template \
            --export-debug "Android Quest" \
            build/android-quest/2EK-Client-Quest.apk
          test -s build/android-quest/2EK-Client-Quest.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: 2EK-Client-Quest-APK
          path: build/android-quest/2EK-Client-Quest.apk
          if-no-files-found: error
          retention-days: 14
